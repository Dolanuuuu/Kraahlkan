events {
    worker_connections 1024;
}

http {
    upstream kraahl_web {
        server web:3000;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=kraahl_limit:10m rate=30r/m;

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name kan.kraahl.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Optionnel: restreindre l'accès au réseau OpenVPN uniquement
        # Décommenter les lignes ci-dessous pour n'autoriser que le VPN
        # allow 10.8.0.0/24;   # Réseau OpenVPN
        # allow 127.0.0.1;     # Localhost
        # deny all;

        client_max_body_size 50M;

        location / {
            proxy_pass http://kraahl_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
        }
    }

    # Accès HTTP direct sur port 3000 via VPN (sans TLS)
    # Utile si le VPN gère déjà le chiffrement
    server {
        listen 8080;
        server_name _;

        # Restreindre au réseau VPN uniquement sur ce port non-TLS
        allow 10.8.0.0/24;
        allow 127.0.0.1;
        deny all;

        location / {
            proxy_pass http://kraahl_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }
    }
}
